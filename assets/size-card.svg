<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="The whole game in one 13.6 KB file, 0 external scripts">
  <title>The whole game in one 13.6 KB file</title>
  <style>
    .big{font:800 56px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#ff8a2a}
    .lbl{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#ff8a2a}
    .sub{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
  </style>
  <rect x="2" y="2" width="236" height="206" rx="16" fill="none" stroke="#ff8a2a" stroke-width="2" stroke-opacity=".5"/>
  <text x="120" y="92" text-anchor="middle" class="big">13.6 KB</text>
  <text x="120" y="128" text-anchor="middle" class="lbl">the whole game, one file</text>
  <text x="120" y="164" text-anchor="middle" class="sub">0 external scripts</text>
